<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entendre Rafting | Contact Us</title>
    <meta name="description"
      content="Get in touch with Entendre Whitewater Rafting for inquiries, reservation questions, or feedback. Contact our team or visit our location.">
    <meta name="author" content="Promise Archibong Edet">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <!-- Logo -->
        <img src="images/rafting-logo.png" alt="water rafting logo" class="logo">
        <!-- Navigation bar -->
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Company Contact Details -->
        <section class="company-info">
            <h1 class="contact-title">Contact Entendre Whitewater</h1>
            <p>123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com</p>
        </section>

        <!-- Map & Contact Form Layout -->
        <div class="contact-grid">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450937!2d-122.4194155!3d37.7749295!2m3!10f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDQ2JzI5LjciTiAxMjLCsDI1JzA5LjkiVw!5e0!3m2!1sen!2sus!4v1600000000000"
                  width="600" height="450" allowfullscreen="" loading="lazy">
                </iframe>
            </div>

            <form action="#" method="post" class="contact-form">
                <div class="form-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>

                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com"
                      required>
                </div>

                <fieldset class="radio-group">
                    <legend>Message Purpose</legend>
                    <label>
                        <input type="radio" name="purpose" value="general" checked> General Inquiry
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="reservation"> Reservation Question
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="suggestion"> Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here..."
                      required></textarea>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </div>

        <!-- Team Section -->
        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="team-container">
                <figure>
                    <img src="images/employee1.jpeg" alt="Sarah Jenkins, Operations Manager">
                    <figcaption>Sarah Jenkins<br><span>Operations Manager</span></figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpeg" alt="Mark River, Lead Guide">
                    <figcaption>Mark River<br><span>Lead River Guide</span></figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpeg" alt="Elena Vance, Customer Relations">
                    <figcaption>Elena Vance<br><span>Customer Relations</span></figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 | Entendre's Whitewater | Promise Edet</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
